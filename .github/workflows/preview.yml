name: Publish page preview

on:
  push:
    branches: ["main"]
    paths:
      - "html/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare visual preview
        run: |
          cp -R html _site
          sed -i 's@</head>@<meta name="robots" content="noindex, nofollow">\n</head>@' _site/index.html
      - name: Upload HTML and assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v5
